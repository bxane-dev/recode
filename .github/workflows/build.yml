name: installers

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-installer:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Prepare Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup executable was not produced." }
          Copy-Item $setup.FullName "installer-output/Recode-Setup-Windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Recode-Windows-Installer
          path: installer-output/Recode-Setup-Windows-x64.exe
          if-no-files-found: error

  linux-installers:
    name: Linux installers
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test

      - name: Build Debian and AppImage packages
        run: npm run tauri build -- --bundles deb,appimage

      - name: Prepare Linux installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installer-output
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$DEB"
          test -n "$APPIMAGE"
          cp "$DEB" installer-output/Recode-Linux-x64.deb
          cp "$APPIMAGE" installer-output/Recode-Linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: Recode-Linux-Installers
          path: |
            installer-output/Recode-Linux-x64.deb
            installer-output/Recode-Linux-x64.AppImage
          if-no-files-found: error
