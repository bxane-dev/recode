name: publish-v1.5-prebuilt

on:
  push:
    branches:
      - "publish/v1.5.0"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.5 build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p downloaded release-assets
          gh run download 37360001967 -n Recode-Windows-Installer -D downloaded/windows
          gh run download 37360001967 -n Recode-Linux-Installers -D downloaded/linux
          find downloaded -maxdepth 3 -type f -print
          cp downloaded/windows/Recode-Setup-Windows-x64.exe release-assets/
          cp downloaded/linux/Recode-Linux-x64.deb release-assets/
          cp downloaded/linux/Recode-Linux-x64.AppImage release-assets/
          chmod +x release-assets/Recode-Linux-x64.AppImage

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Recode-* > SHA256SUMS.txt

      - name: Publish v1.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v1.5.0 >/dev/null 2>&1; then
            gh release upload v1.5.0 release-assets/* --clobber
            gh release edit v1.5.0 --title "Recode v1.5.0" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v1.5.0 release-assets/* \
              --target 466a50e103465f310a5a26dfaa7d63cff5b5663a \
              --title "Recode v1.5.0" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
