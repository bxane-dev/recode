name: release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            artifact: Recode-Release-Windows
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: Recode-Release-Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY || process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD === undefined) { console.error('Missing Tauri updater signing secrets.'); process.exit(1) }"

      - name: Build frontend
        run: npm run build

      - name: Test Rust core
        working-directory: src-tauri
        run: cargo test

      - name: Build installers and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json

      - name: Prepare Windows release assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup executable was not produced." }
          $sig = "$($setup.FullName).sig"
          if (-not (Test-Path $sig)) { throw "NSIS updater signature was not produced." }
          Copy-Item $setup.FullName "release-assets/Recode-Setup-Windows-x64.exe"
          Copy-Item $sig "release-assets/Recode-Setup-Windows-x64.exe.sig"

      - name: Prepare Linux release assets
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n 1)"
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          test -n "$DEB"
          test -n "$APPIMAGE"
          test -f "$APPIMAGE.sig"
          cp "$DEB" release-assets/Recode-Linux-x64.deb
          cp "$APPIMAGE" release-assets/Recode-Linux-x64.AppImage
          cp "$APPIMAGE.sig" release-assets/Recode-Linux-x64.AppImage.sig
          chmod +x release-assets/Recode-Linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: Recode-Release-*
          path: release-assets
          merge-multiple: true

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#release/}"
          PACKAGE_VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$VERSION" = "v$PACKAGE_VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create updater manifest
        env:
          VERSION: ${{ env.VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-updater-manifest.mjs

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum Recode-* latest.json > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release-assets/* --clobber
            gh release edit "$VERSION" --title "Recode $VERSION" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$VERSION" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Recode $VERSION" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
